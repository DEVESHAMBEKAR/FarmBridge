<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes drawCheck {
            0% { stroke-dashoffset: 48; }
            100% { stroke-dashoffset: 0; }
        }
        .checkmark-animate {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: drawCheck 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
            animation-delay: 0.2s;
        }

        .success-bg-glow {
            background: radial-gradient(circle at center, rgba(163, 246, 156, 0.2) 0%, transparent 70%);

        body::-webkit-scrollbar { display: none; }
        body { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top Navigation Anchor (Shared Component Logic) -->
<!-- Suppressed TopAppBar for Transactional Success Screen to prioritize focus -->
<main class="flex-grow flex items-center justify-center p-gutter relative overflow-hidden">
<!-- Ambient Decorative Elements -->
<div class="absolute top-0 left-0 w-full h-full success-bg-glow pointer-events-none"></div>
<div class="max-w-md w-full z-10 flex flex-col items-center">
<!-- Success Animation / Icon -->
<div class="mb-xl relative">
<div class="w-24 h-24 bg-primary-fixed rounded-full flex items-center justify-center shadow-sm">
<svg class="w-16 h-16 text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24">
<polyline class="checkmark-animate" points="20 6 9 17 4 12"></polyline>
</svg>
</div>
<!-- Subtle Ripple Effect -->
<div class="absolute inset-0 rounded-full border-2 border-primary-fixed opacity-30 animate-ping"></div>
</div>
<!-- Main Message -->
<div class="text-center mb-xl space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Order Placed Successfully!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">Thank you for supporting local farmers.</p>
</div>
<!-- Bento Card Layout for Details -->
<div class="w-full grid grid-cols-1 gap-md mb-xl">
<!-- Order ID & Delivery Slot -->
<div class="bg-surface-container-low p-lg rounded-xl border border-outline-variant/30 flex items-start gap-md">
<div class="bg-primary-container/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Estimated Delivery</span>
<span class="font-title-lg text-title-lg text-primary">Arriving Today</span>
<span class="font-body-md text-body-md text-on-surface">5:00 PM - 7:00 PM</span>
</div>
</div>
<!-- Secondary Detail Row -->
<div class="grid grid-cols-2 gap-md">
<div class="bg-surface-container-low p-lg rounded-xl border border-outline-variant/30">
<span class="font-label-md text-label-md text-on-surface-variant block mb-1">Order ID</span>
<span class="font-body-md text-body-md font-bold text-on-surface">#FB-827391</span>
</div>
<div class="bg-surface-container-low p-lg rounded-xl border border-outline-variant/30">
<span class="font-label-md text-label-md text-on-surface-variant block mb-1">Payment</span>
<span class="font-body-md text-body-md font-bold text-on-surface">Wallet</span>
</div>
</div>
<!-- Address Summary Card -->
<div class="bg-surface-container-low p-lg rounded-xl border border-outline-variant/30 flex items-start gap-md">
<div class="bg-secondary-container/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Delivery Address</span>
<span class="font-body-md text-body-md text-on-surface mt-1 leading-relaxed">
                            Green Valley Farmhouse, Sector 4<br/>
                            Rural Hub, 560023
                        </span>
</div>
</div>
</div>

                    Track Order
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<a class="w-full h-[56px] flex items-center justify-center font-label-md text-label-md text-primary hover:bg-primary-container/10 rounded-full transition-colors" href="#">
                    Back to Marketplace
                </a>
</div>
</div>
</main>
<!-- Bottom Navigation Shell Suppression (Transactional Rule Applied) -->
<!-- Navigation shell is excluded as per the "Destination" rule for transactional success screens. -->
<script>
        // Micro-interaction for feedback
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute w-2 h-2 bg-white/20 rounded-full animate-ping pointer-events-none';
                ripple.style.left = e.clientX + 'px';
                ripple.style.top = e.clientY + 'px';
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
